<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Create a new version for ' + ${dataset.nome}">Create a new version</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            color: #24292f;
        }

        /* BARRA SUPERIOR */
        .barra-superior {
            background-color: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            z-index: 1000;
        }

        .usuario-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #d0d7de;
        }

        .nome-usuario {
            font-weight: 600;
            font-size: 14px;
        }

        .link-voltar {
            color: #57606a;
            text-decoration: none;
            font-size: 14px;
        }

        .link-voltar:hover {
            color: #0969da;
        }

        /* CONTAINER PRINCIPAL */
        .container-criacao {
            max-width: 768px;
            margin: 100px auto 40px auto;
            padding: 0 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .subtitulo-pagina {
            font-size: 14px;
            color: #57606a;
            margin-top: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 16px;
        }

        /* BANNER DE INFORMAÇÃO DA VERSÃO BASE (Estilo Branch/Tag do Git) */
        .alerta-base {
            background-color: #ddf4ff;
            border: 1px solid rgba(84, 174, 255, 0.4);
            color: #0969da;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-codigo {
            background-color: rgba(9, 105, 218, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: 600;
        }

        /* COMPONENTES DO FORMULÁRIO */
        .secao-form {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .numero-secao {
            width: 24px;
            height: 24px;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #57606a;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .conteudo-secao {
            flex-grow: 1;
        }

        .titulo-secao {
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            margin-bottom: 16px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            outline: none;
            color: #24292f;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            background-color: #ffffff;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .texto-ajuda {
            font-size: 12px;
            color: #57606a;
            margin-top: 4px;
            margin-bottom: 0;
        }

        /* Upload de arquivo */
        .input-file-custom {
            background: #ffffff;
            border: 1px dashed #d0d7de;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
        }

        /* BOTÃO DE SUBMIT (Verde do GitHub) */
        .container-botao {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #d0d7de;
            padding-top: 24px;
            margin-top: 24px;
        }

        .btn-criar {
            background-color: #1f883d;
            color: #ffffff;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 0 rgba(27, 31, 36, 0.1);
            transition: background-color 0.2s;
        }

        .btn-criar:hover {
            background-color: #1a7f37;
        }
    </style>
</head>
<body>

    <div class="barra-superior">
        <div class="usuario-info">
            <img class="icon" th:src="@{/perfil_icon.png}" alt="Perfil">
            <span class="nome-usuario" th:text="${usuario.nome}">Nome do Usuário</span>
        </div>
        <a th:href="@{/dataset/{id}(id=${dataset.id})}" class="link-voltar">Cancel</a>
    </div>

    <div class="container-criacao">
        <h1>Create a new version</h1>
        <p class="subtitulo-pagina" th:text="'Publishing a new release for ' + ${dataset.nome}"></p>

        <div class="alerta-base" th:if="${baseId != null}">
            <span>🌿 You are creating a variation branching from the current version ID: </span>
            <span class="tag-codigo" th:text="'#id-' + ${baseId}">#id-base</span>
        </div>

        <form th:action="@{/dataset/{idDataset}/criar-versao(idDataset=${dataset.id}, baseId=${baseId})}" th:object="${novaVersao}" method="POST" enctype="multipart/form-data">
            
            <div class="secao-form">
                <div class="numero-secao">1</div>
                <div class="conteudo-secao">
                    <div class="titulo-secao">Release Changes</div>
                    
                    <div class="campo-grupo" style="max-width: 200px;">
                        <label>Version tag *</label>
                        <input type="text" th:field="*{numVersao}" placeholder="e.g., v2.0" required autocomplete="off">
                        <p class="texto-ajuda">Increment your current schema value.</p>
                    </div>

                    <div class="campo-grupo">
                        <label>What's changed in this version? <span style="font-weight: 400; color: #57606a;">(optional)</span></label>
                        <textarea th:field="*{descricaoModificacoes}" placeholder="Describe features added, rows cleanups or schema updates..."></textarea>
                    </div>

                    <div class="campo-grupo">
                        <label>Upload the updated CSV *</label>
                        <div class="input-file-custom">
                            <input type="file" name="arquivo" accept=".csv" required>
                        </div>
                        <p class="texto-ajuda">Attach the new dataset source matrix supporting this version.</p>
                    </div>
                </div>
            </div>

            <div class="container-botao">
                <button type="submit" class="btn-criar">Publish version</button>
            </div>

        </form>
    </div>

</body>
</html>
