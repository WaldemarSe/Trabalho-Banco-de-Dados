<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Feature Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            text-align: left;
        }

        .login-container h1 {
            color: #1a2e4c;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background-color: #f0f4f8; 
            font-size: 15px;
            color: #333333;
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #00a2ed;
        }

        .input-group input::placeholder {
            color: #a0aec0;
        }

        .btn-entrar {
            width: 100%;
            padding: 12px;
            background-color: #00a2ed; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-entrar:hover {
            background-color: #008cd1;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>LOGIN</h1>

        <form action="/login-request" method="POST">
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="@mail.com" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="senha" required>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
            
        </form>
    </div>

</body>
</html>
